[package]
name = "optibridge-firmware"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[features]
firmware = []

[[bin]]
name = "optibridge"
path = "src/main.rs"
required-features = ["firmware"]

[dependencies]
optibridge-protocol = { path = "../../crates/optibridge-protocol", default-features = false }

[target.'cfg(target_arch = "riscv32")'.dependencies]
ch32v203g6u6-embassy-hal = { package = "ch32v203g6u6-embassy-hal", path = "../../.generated/ch32v203g6u6/embassy", features = ["flash", "gpio", "i2c-async", "rcc", "wch-runtime"] }
critical-section = "1.2"
embedded-storage = "0.3"
embassy-executor = { version = "0.7.0", features = ["arch-spin", "executor-thread"] }
riscv = { version = "0.12", features = ["critical-section-single-hart"] }
riscv-rt = "0.13"
sonde-bpf = { git = "https://github.com/Alan-Jowett/sonde.git", rev = "29ee7c06070d8a677b7cd50f3de6d501f635e128", default-features = false, features = ["base32", "divmul32"] }
