[package]
name = "i2c-bridge-firmware"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[features]
firmware = []

[[bin]]
name = "i2c-bridge"
path = "src/main.rs"
required-features = ["firmware"]

[dependencies]
optibridge-protocol = { path = "../../crates/optibridge-protocol", default-features = false }

[target.'cfg(target_arch = "riscv32")'.dependencies]
ch32v203g6u6-embassy-hal = { package = "ch32v203g6u6-embassy-hal", path = "../../.generated/ch32v203g6u6/embassy", features = ["i2c", "rcc", "usb", "wch-runtime"] }
embassy-executor = { version = "0.7.0", features = ["arch-spin", "executor-thread"] }
embassy-usb = "0.6.0"
riscv = { version = "0.12", features = ["critical-section-single-hart"] }
riscv-rt = "0.13"
